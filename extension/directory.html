<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择课件保存文件夹</title><link rel="stylesheet" href="directory.css"><script type="module" src="directory.js"></script></head>
<body><main><span class="eyebrow">学习通课件助手</span><h1>课件保存到哪里？</h1><p>选择一个专用文件夹，以后在课件小窗中点击保存，即可自动整理到这里。</p><div class="folder"><span>当前文件夹</span><strong id="folder-name">尚未选择</strong><small id="permission">正在读取设置…</small></div><button id="authorize" hidden>继续使用这个文件夹</button><button id="choose" disabled>选择文件夹</button><p id="status" role="status" aria-live="polite">首次可从桌面选择“课程文件”。</p><button id="return" class="secondary">返回课件助手</button><p id="return-status" role="status" aria-live="polite" hidden></p><footer>只使用你选定的目录；不会修改 Edge 下载位置。</footer></main></body></html>
