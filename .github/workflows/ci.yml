name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Run regression tests
        run: pnpm test
      - name: Build the extension
        run: pnpm run build
      - name: Package the trial distribution
        run: python scripts/package-release.py
      - name: Save installable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chaoxing-study-helper
          path: |
            outputs/chaoxing-study-helper-*/
            outputs/release-*/*
          if-no-files-found: error
          retention-days: 14
