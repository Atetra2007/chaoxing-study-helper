<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习通课件助手 · 操作演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#243249;font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:25px 36px;background:#fff;border-bottom:1px solid #e1e7ef;display:flex;align-items:center;gap:16px}.icon{width:46px;height:46px;border-radius:14px;background:#315ee8;color:white;display:grid;place-items:center;font-size:25px;font-weight:600}h1{font-size:22px;margin:0}header p{margin:3px 0 0;color:#65758d}.badge{margin-left:auto;border:1px solid #cad7ef;background:#eef4ff;padding:5px 12px;color:#365a92;border-radius:24px;font-size:12px}aside{padding:12px 36px;background:#f7f9fc;color:#65758d;border-bottom:1px solid #e1e7ef;font-size:12px}main{width:500px;margin:28px 0 30px 7%;}figure{background:#fff;margin:0 0 24px;padding:16px;box-shadow:0 4px 24px #34486a0c;border:1px solid #e0e5ed;border-radius:10px}figure img{width:100%;height:auto;display:block}figcaption{text-align:center;font-size:12px;color:#8391a4;margin-top:8px}.guide{margin:18px 7% 0;color:#536885;font-size:13px}#offscreen-preview,.harness{display:none}@media(max-width:850px){main{width:44%;margin-left:4%}header{padding:20px}.badge{display:none}}
</style>
<script type="module" src="/tests/floating-preview-runtime.js"></script>
</head>
<body>
<header><div class="icon">▤</div><div><h1>学习通课件助手</h1><p>保存到电脑，按课程整理，方便离线阅读和批注。</p></div><span class="badge">0.4.3 正式版 · Chrome / Edge</span></header>
<aside data-cx-study-helper>操作演示 · 31页自制合成课件 · 使用模拟浏览器接口，不代表真实学习通页面验收。</aside>
<div class="guide">打开课件　→　核对名称与页数　→　选择保存位置　→　保存并检查结果</div>
<div class="harness" data-cx-study-helper><header class="reader"><span></span></header><p id="preview-mode"></p><button id="restore-test-network" hidden>恢复测试网络</button><button id="preview-toggle">模拟点击扩展图标</button><p id="preview-state"></p><p id="preview-result"></p></div>
<main id="sample-pages" aria-label="合成课件页面"></main>
</body>
</html>
